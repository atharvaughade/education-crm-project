spring.application.name=EducationCRM
server.port=${SERVER_PORT:8080}

# Keep secrets outside this file. STS uses application-local.properties by default.
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/education_crm?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

spring.thymeleaf.cache=${THYMELEAF_CACHE:false}
server.error.include-message=always

logging.level.org.springframework.security=${SECURITY_LOG_LEVEL:INFO}
logging.level.com.atharva.educationcrm=INFO

# Optional safe bootstrap. Enable only when the database has no admin account.
app.bootstrap.admin.enabled=${APP_BOOTSTRAP_ADMIN_ENABLED:false}
app.bootstrap.admin.email=${APP_ADMIN_EMAIL:}
app.bootstrap.admin.password=${APP_ADMIN_PASSWORD:}
app.bootstrap.admin.mobile=${APP_ADMIN_MOBILE:}
