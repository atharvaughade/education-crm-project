<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Feedback')}"></head>
<body>
<nav th:replace="~{fragments/student-navbar :: navbar('feedback')}"></nav>
<main class="student-page"><div class="container"><div th:replace="~{fragments/alerts :: alerts}"></div><div class="page-heading"><h1>Feedback</h1><p class="text-muted">Share your learning experience and read administrator responses.</p></div><div class="row g-4"><div class="col-lg-5"><div class="surface p-4"><h2 class="h5 mb-3">New feedback</h2><form th:action="@{/student/feedback}" th:object="${feedbackForm}" method="post"><div class="mb-3"><label class="form-label">Rating</label><select class="form-select" th:field="*{rating}"><option th:each="rating : ${#numbers.sequence(5,1)}" th:value="${rating}" th:text="${rating + ' / 5'}"></option></select></div><div class="mb-3"><label class="form-label">Subject</label><input class="form-control" th:field="*{subject}"><div class="field-error" th:errors="*{subject}"></div></div><div class="mb-3"><label class="form-label">Message</label><textarea class="form-control" rows="5" th:field="*{message}"></textarea><div class="field-error" th:errors="*{message}"></div></div><button class="btn btn-primary" type="submit">Submit feedback</button></form></div></div><div class="col-lg-7"><div class="surface p-4"><h2 class="h5 mb-3">Previous feedback</h2><div class="border-bottom py-3" th:each="item : ${feedbackItems}"><div class="d-flex justify-content-between gap-3"><strong th:text="${item.subject}"></strong><span class="status" th:classappend="${item.status}" th:text="${item.status}"></span></div><div class="small text-warning my-1" th:text="${'★'.repeat(item.rating)}"></div><p class="mb-2" th:text="${item.message}"></p><div class="alert alert-light mb-0" th:if="${item.adminResponse}"><strong>Admin response:</strong> <span th:text="${item.adminResponse}"></span></div></div><div class="empty-state" th:if="${#lists.isEmpty(feedbackItems)}">No feedback submitted yet.</div></div></div></div></div></main>
<script th:replace="~{fragments/alerts :: scripts}"></script>
</body></html>
