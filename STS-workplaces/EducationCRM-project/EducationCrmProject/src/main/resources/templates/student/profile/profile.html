<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('My profile')}"></head>
<body>
<nav th:replace="~{fragments/student-navbar :: navbar('profile')}"></nav>
<main class="student-page"><div class="container" style="max-width: 1000px"><div th:replace="~{fragments/alerts :: alerts}"></div><div class="page-heading"><h1>My profile</h1><p class="text-muted">Manage personal details and your sign-in password.</p></div><div class="row g-4"><div class="col-lg-7"><div class="surface p-4"><h2 class="h5 mb-4">Personal information</h2><form th:action="@{/student/profile}" th:object="${profileUpdateForm}" method="post"><div class="row g-3"><div class="col-md-6"><label class="form-label">First name</label><input class="form-control" th:field="*{firstName}"><div class="field-error" th:errors="*{firstName}"></div></div><div class="col-md-6"><label class="form-label">Last name</label><input class="form-control" th:field="*{lastName}"><div class="field-error" th:errors="*{lastName}"></div></div><div class="col-12"><label class="form-label">Email</label><input class="form-control" th:value="${student.email}" readonly><div class="form-text">The login email is managed by an administrator.</div></div><div class="col-md-6"><label class="form-label">Mobile</label><input class="form-control" th:field="*{mobile}"><div class="field-error" th:errors="*{mobile}"></div></div><div class="col-md-6"><label class="form-label">City</label><input class="form-control" th:field="*{city}"><div class="field-error" th:errors="*{city}"></div></div><div class="col-12"><button class="btn btn-primary" type="submit">Save profile</button></div></div></form></div></div><div class="col-lg-5"><div class="surface p-4 mb-4"><h2 class="h5 mb-3">Account</h2><div class="detail-item"><small>Status</small><span class="status" th:classappend="${student.status}" th:text="${student.status}"></span></div><div class="detail-item mt-2"><small>Joined</small><strong th:text="${student.admissionDate}"></strong></div><div class="detail-item mt-2"><small>Registration</small><strong th:text="${student.registrationType}"></strong></div></div><div class="surface p-4"><h2 class="h5 mb-3">Change password</h2><form th:action="@{/student/profile/change-password}" th:object="${passwordChangeForm}" method="post"><div class="mb-3"><label class="form-label">Current password</label><input class="form-control" type="password" th:field="*{currentPassword}" autocomplete="current-password"></div><div class="mb-3"><label class="form-label">New password</label><input class="form-control" type="password" th:field="*{newPassword}" autocomplete="new-password"></div><div class="mb-3"><label class="form-label">Confirm new password</label><input class="form-control" type="password" th:field="*{confirmPassword}" autocomplete="new-password"></div><button class="btn btn-outline-primary" type="submit">Change password</button></form></div></div></div></div></main>
<script th:replace="~{fragments/alerts :: scripts}"></script>
</body></html>
