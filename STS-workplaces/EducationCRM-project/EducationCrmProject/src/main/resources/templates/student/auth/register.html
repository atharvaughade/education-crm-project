<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Student registration')}"></head>
<body class="auth-page">
<main class="surface auth-card">
    <a class="d-flex align-items-center gap-2 fw-bold mb-4" th:href="@{/}"><img class="logo" th:src="@{/images/sp-logo.jpg}" alt="Education CRM"> Education CRM</a>
    <h1 class="h3">Create your student account</h1><p class="text-muted">Use a unique email and mobile number.</p>
    <form th:action="@{/auth/signup}" th:object="${registrationForm}" method="post" class="mt-4" novalidate>
        <div th:if="${#fields.hasGlobalErrors()}" class="alert alert-danger"><div th:each="error : ${#fields.globalErrors()}" th:text="${error}"></div></div>
        <div class="row g-3">
            <div class="col-md-6"><label class="form-label">First name</label><input class="form-control" th:field="*{firstName}"><div class="field-error" th:errors="*{firstName}"></div></div>
            <div class="col-md-6"><label class="form-label">Last name</label><input class="form-control" th:field="*{lastName}"><div class="field-error" th:errors="*{lastName}"></div></div>
            <div class="col-12"><label class="form-label">Email</label><input class="form-control" type="email" th:field="*{email}"><div class="field-error" th:errors="*{email}"></div></div>
            <div class="col-md-6"><label class="form-label">Mobile</label><input class="form-control" th:field="*{mobile}"><div class="field-error" th:errors="*{mobile}"></div></div>
            <div class="col-md-6"><label class="form-label">City</label><input class="form-control" th:field="*{city}"><div class="field-error" th:errors="*{city}"></div></div>
            <div class="col-md-6"><label class="form-label">Password</label><input class="form-control" type="password" th:field="*{password}" autocomplete="new-password"><div class="field-error" th:errors="*{password}"></div></div>
            <div class="col-md-6"><label class="form-label">Confirm password</label><input class="form-control" type="password" th:field="*{confirmPassword}" autocomplete="new-password"><div class="field-error" th:errors="*{confirmPassword}"></div></div>
            <div class="col-12"><label class="form-check"><input class="form-check-input" type="checkbox" th:field="*{acceptedTerms}"><span class="form-check-label">I confirm that these details are correct.</span></label><div class="field-error" th:errors="*{acceptedTerms}"></div></div>
            <div class="col-12"><button class="btn btn-primary w-100" type="submit">Create account</button></div>
        </div>
    </form>
    <div class="text-center mt-4">Already registered? <a th:href="@{/auth/login}">Sign in</a></div>
</main>
</body>
</html>
