<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Checkout')}"></head>
<body>
<nav th:replace="~{fragments/student-navbar :: navbar('courses')}"></nav>
<main class="student-page"><div class="container" style="max-width: 900px"><div class="page-heading"><h1>Demo checkout</h1><p class="text-muted">This interview project records a simulated successful payment. No money is charged.</p></div><div class="row g-4"><div class="col-lg-5"><div class="surface p-4"><span class="badge-soft" th:text="${course.category}"></span><h2 class="h4 mt-3" th:text="${course.title}"></h2><p class="text-muted" th:text="${course.description}"></p><hr><div class="d-flex justify-content-between"><strong>Total</strong><span class="price" th:text="${'₹' + course.price}"></span></div></div></div><div class="col-lg-7"><div class="surface p-4"><form th:action="@{/student/checkout}" th:object="${checkoutForm}" method="post"><input type="hidden" th:field="*{courseId}"><div class="mb-3"><label class="form-label">Student</label><input class="form-control" th:value="${student.fullName + ' · ' + student.email}" readonly></div><div class="mb-3"><label class="form-label">Payment method</label><select class="form-select" th:field="*{paymentMethod}"><option th:each="method : ${paymentMethods}" th:value="${method}" th:text="${#strings.replace(method, '_', ' ')}"></option></select><div class="field-error" th:errors="*{paymentMethod}"></div></div><label class="form-check mb-4"><input class="form-check-input" type="checkbox" th:field="*{confirmed}"><span class="form-check-label">I understand that this is a simulated payment for the project demonstration.</span></label><div class="field-error mb-3" th:errors="*{confirmed}"></div><button class="btn btn-primary w-100" type="submit">Complete enrollment</button></form></div></div></div></div></main>
<script th:replace="~{fragments/alerts :: scripts}"></script>
</body></html>
