<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('My learning')}"></head>
<body>
<nav th:replace="~{fragments/student-navbar :: navbar('learning')}"></nav>
<main class="student-page"><div class="container"><div th:replace="~{fragments/alerts :: alerts}"></div><div class="page-heading"><h1>My Learning</h1><p class="text-muted">Update progress as you complete each course.</p></div><div class="row g-4" th:if="${!#lists.isEmpty(enrollments)}"><div class="col-lg-6" th:each="enrollment : ${enrollments}"><article class="surface p-4"><div class="d-flex justify-content-between"><span class="badge-soft" th:text="${enrollment.course.category}"></span><span class="status" th:classappend="${enrollment.status}" th:text="${enrollment.status}"></span></div><h2 class="h5 mt-3" th:text="${enrollment.course.title}"></h2><div class="d-flex justify-content-between small mb-2"><span>Progress</span><strong th:text="${enrollment.progress + '%'}"></strong></div><div class="progress mb-3"><div class="progress-bar" th:style="${'width:' + enrollment.progress + '%'}"></div></div><form class="d-flex gap-2" th:action="@{/student/learning/progress}" method="post"><input type="hidden" name="enrollmentId" th:value="${enrollment.id}"><select class="form-select" name="progress"><option th:each="value : ${#numbers.sequence(0,100,10)}" th:value="${value}" th:text="${value + '%'}" th:selected="${value == enrollment.progress}"></option></select><button class="btn btn-outline-primary" type="submit">Update</button></form></article></div></div><div class="surface empty-state" th:if="${#lists.isEmpty(enrollments)}"><h2 class="h5">Your learning shelf is empty</h2><p>Enroll in an active course to begin.</p><a class="btn btn-primary" th:href="@{/student/home}">Browse courses</a></div><div class="surface data-card mt-5" th:if="${!#lists.isEmpty(payments)}"><h2 class="h5 mb-3">Payment history</h2><div class="table-responsive"><table class="table"><thead><tr><th>Reference</th><th>Course</th><th>Method</th><th>Amount</th><th>Status</th></tr></thead><tbody><tr th:each="payment : ${payments}"><td th:text="${payment.reference}"></td><td th:text="${payment.course.title}"></td><td th:text="${payment.method}"></td><td th:text="${'₹' + payment.amount}"></td><td><span class="status" th:classappend="${payment.status}" th:text="${payment.status}"></span></td></tr></tbody></table></div></div></div></main>
<script th:replace="~{fragments/alerts :: scripts}"></script>
</body></html>
