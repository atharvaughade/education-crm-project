<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<nav th:fragment="navbar(active)" class="navbar navbar-expand-lg site-nav navbar-dark sticky-top">
    <div class="container">
        <a class="navbar-brand d-flex align-items-center gap-2 fw-bold" th:href="@{/student/dashboard}">
            <img class="logo" th:src="@{/images/sp-logo.jpg}" alt="Education CRM"> Education CRM
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#studentNav"><span class="navbar-toggler-icon"></span></button>
        <div class="collapse navbar-collapse" id="studentNav">
            <ul class="navbar-nav ms-auto align-items-lg-center gap-lg-1">
                <li class="nav-item"><a class="nav-link" th:classappend="${active == 'dashboard'} ? ' active'" th:href="@{/student/dashboard}">Dashboard</a></li>
                <li class="nav-item"><a class="nav-link" th:classappend="${active == 'courses'} ? ' active'" th:href="@{/student/home}">Courses</a></li>
                <li class="nav-item"><a class="nav-link" th:classappend="${active == 'learning'} ? ' active'" th:href="@{/student/learning}">My Learning</a></li>
                <li class="nav-item"><a class="nav-link" th:classappend="${active == 'feedback'} ? ' active'" th:href="@{/student/feedback}">Feedback</a></li>
                <li class="nav-item"><a class="nav-link" th:classappend="${active == 'profile'} ? ' active'" th:href="@{/student/profile}">Profile</a></li>
                <li class="nav-item ms-lg-2">
                    <form th:action="@{/logout}" method="post"><button class="btn btn-outline-light btn-sm" type="submit">Sign out</button></form>
                </li>
            </ul>
        </div>
    </div>
</nav>
</body>
</html>
