<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Feedback')}"></head>
<body><div class="app-shell"><aside th:replace="~{fragments/admin-sidebar :: sidebar('feedback')}"></aside><main class="app-main"><header th:replace="~{fragments/admin-topbar :: topbar('Student feedback')}"></header><div th:replace="~{fragments/alerts :: alerts}"></div><div class="row g-4"><div class="col-xl-6" th:each="item : ${feedbackItems}"><article class="surface p-4"><div class="d-flex justify-content-between gap-3"><div><strong th:text="${item.subject}"></strong><div class="small text-muted" th:text="${item.student.fullName + ' · ' + item.student.email}"></div></div><span class="status" th:classappend="${item.status}" th:text="${item.status}"></span></div><div class="text-warning my-2" th:text="${item.rating + ' / 5 stars'}"></div><p th:text="${item.message}"></p><form class="mt-3" th:action="@{/admin/feedback/respond}" method="post"><input type="hidden" name="id" th:value="${item.id}"><div class="row g-2"><div class="col-md-4"><select class="form-select" name="status"><option th:each="status : ${statuses}" th:value="${status}" th:text="${status}" th:selected="${status == item.status}"></option></select></div><div class="col-md-8"><input class="form-control" name="response" th:value="${item.adminResponse}" placeholder="Administrator response"></div><div class="col-12"><button class="btn btn-sm btn-primary">Save response</button></div></div></form></article></div></div><div class="surface empty-state" th:if="${#lists.isEmpty(feedbackItems)}">No feedback has been submitted.</div></main></div><script th:replace="~{fragments/alerts :: scripts}"></script></body></html>
