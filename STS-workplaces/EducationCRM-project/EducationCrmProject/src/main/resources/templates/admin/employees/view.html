<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Employees')}"></head>
<body><div class="app-shell"><aside th:replace="~{fragments/admin-sidebar :: sidebar('employees')}"></aside><main class="app-main"><header th:replace="~{fragments/admin-topbar :: topbar('Employees')}"></header><div th:replace="~{fragments/alerts :: alerts}"></div><div class="surface data-card"><div class="d-flex justify-content-between gap-3 flex-wrap mb-3"><form class="d-flex gap-2 flex-grow-1" method="get" th:action="@{/admin/employees}"><input class="form-control" name="keyword" th:value="${keyword}" placeholder="Search employees"><button class="btn btn-outline-primary">Search</button><a class="btn btn-outline-secondary" th:href="@{/admin/employees}">Clear</a></form><a class="btn btn-primary" th:href="@{/admin/employees/add}">Add employee</a></div><div class="table-responsive"><table class="table"><thead><tr><th>Name</th><th>Department</th><th>Designation</th><th>Email</th><th>Status</th><th>Actions</th></tr></thead><tbody><tr th:each="employee : ${employees}"><td th:text="${employee.fullName}"></td><td th:text="${employee.department}"></td><td th:text="${employee.designation}"></td><td th:text="${employee.email}"></td><td><span class="status" th:classappend="${employee.status}" th:text="${employee.status}"></span></td><td><div class="action-row"><a class="btn btn-sm btn-outline-secondary" th:href="@{/admin/employees/edit(id=${employee.id})}">Edit</a><form th:action="@{/admin/employees/delete}" method="post" onsubmit="return confirm('Deactivate this employee?')"><input type="hidden" name="id" th:value="${employee.id}"><button class="btn btn-sm btn-outline-danger">Deactivate</button></form></div></td></tr><tr th:if="${#lists.isEmpty(employees)}"><td colspan="6" class="text-center text-muted py-5">No employees found.</td></tr></tbody></table></div></div></main></div><script th:replace="~{fragments/alerts :: scripts}"></script></body></html>
