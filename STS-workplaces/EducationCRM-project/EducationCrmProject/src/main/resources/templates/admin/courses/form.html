<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="form(buttonLabel)" class="surface p-4">
    <form th:action="${course.id == null} ? @{/admin/courses/add} : @{/admin/courses/edit}" th:object="${course}" method="post" novalidate>
        <input th:if="${course.id != null}" type="hidden" th:field="*{id}">
        <div class="row g-3">
            <div class="col-md-8"><label class="form-label">Title</label><input class="form-control" th:field="*{title}"><div class="field-error" th:errors="*{title}"></div></div>
            <div class="col-md-4"><label class="form-label">Category</label><input class="form-control" th:field="*{category}"><div class="field-error" th:errors="*{category}"></div></div>
            <div class="col-12"><label class="form-label">Description</label><textarea class="form-control" rows="5" th:field="*{description}"></textarea><div class="field-error" th:errors="*{description}"></div></div>
            <div class="col-md-3"><label class="form-label">Price</label><input class="form-control" type="number" step="0.01" min="0" th:field="*{price}"><div class="field-error" th:errors="*{price}"></div></div>
            <div class="col-md-3"><label class="form-label">Duration (hours)</label><input class="form-control" type="number" min="1" th:field="*{duration}"><div class="field-error" th:errors="*{duration}"></div></div>
            <div class="col-md-3"><label class="form-label">Level</label><select class="form-select" th:field="*{level}"><option th:each="level : ${levels}" th:value="${level}" th:text="${level}"></option></select></div>
            <div class="col-md-3"><label class="form-label">Status</label><select class="form-select" th:field="*{status}"><option th:each="status : ${statuses}" th:value="${status}" th:text="${status}"></option></select></div>
            <div class="col-12"><label class="form-label">Image path or URL</label><input class="form-control" th:field="*{imageUrl}" placeholder="images/course.jpg or https://..."></div>
            <div class="col-12 d-flex gap-2"><button class="btn btn-primary" type="submit" th:text="${buttonLabel}"></button><a class="btn btn-outline-secondary" th:href="@{/admin/courses/view}">Cancel</a></div>
        </div>
    </form>
</div>
</body>
</html>
