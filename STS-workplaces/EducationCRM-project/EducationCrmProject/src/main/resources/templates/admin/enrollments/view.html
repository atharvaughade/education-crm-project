<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Enrollments')}"></head>
<body><div class="app-shell"><aside th:replace="~{fragments/admin-sidebar :: sidebar('enrollments')}"></aside><main class="app-main"><header th:replace="~{fragments/admin-topbar :: topbar('Enrollments')}"></header><div class="surface data-card"><div class="table-responsive"><table class="table"><thead><tr><th>Student</th><th>Course</th><th>Enrolled</th><th>Progress</th><th>Status</th></tr></thead><tbody><tr th:each="enrollment : ${enrollments}"><td><strong th:text="${enrollment.student.fullName}"></strong><div class="small text-muted" th:text="${enrollment.student.email}"></div></td><td th:text="${enrollment.course.title}"></td><td th:text="${enrollment.enrolledAt}"></td><td><div class="d-flex align-items-center gap-2"><div class="progress flex-grow-1" style="min-width:100px"><div class="progress-bar" th:style="${'width:' + enrollment.progress + '%'}"></div></div><span th:text="${enrollment.progress + '%'}"></span></div></td><td><span class="status" th:classappend="${enrollment.status}" th:text="${enrollment.status}"></span></td></tr><tr th:if="${#lists.isEmpty(enrollments)}"><td colspan="5" class="text-center text-muted py-5">No enrollments yet.</td></tr></tbody></table></div></div></main></div></body></html>
