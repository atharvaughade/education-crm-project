<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Course details')}"></head>
<body><div class="app-shell"><aside th:replace="~{fragments/admin-sidebar :: sidebar('courses')}"></aside><main class="app-main"><header th:replace="~{fragments/admin-topbar :: topbar('Course details')}"></header><div class="surface p-4"><div class="d-flex justify-content-between align-items-start mb-4"><div><span class="badge-soft" th:text="${course.category}"></span><h2 class="h4 mt-2" th:text="${course.title}"></h2></div><div class="action-row"><a class="btn btn-outline-secondary" th:href="@{/admin/courses/view}">Back</a><a class="btn btn-primary" th:href="@{/admin/courses/edit(id=${course.id})}">Edit</a></div></div><p th:text="${course.description}"></p><div class="detail-grid mt-4"><div class="detail-item"><small>Price</small><strong th:text="${'₹' + course.price}"></strong></div><div class="detail-item"><small>Duration</small><strong th:text="${course.duration + ' hours'}"></strong></div><div class="detail-item"><small>Level</small><strong th:text="${course.level}"></strong></div><div class="detail-item"><small>Status</small><span class="status" th:classappend="${course.status}" th:text="${course.status}"></span></div><div class="detail-item"><small>Image path</small><strong th:text="${course.imageUrl ?: 'Default banner'}"></strong></div><div class="detail-item"><small>Created</small><strong th:text="${course.createdAt}"></strong></div></div></div></main></div></body></html>
