<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Student details')}"></head>
<body><div class="app-shell"><aside th:replace="~{fragments/admin-sidebar :: sidebar('students')}"></aside><main class="app-main"><header th:replace="~{fragments/admin-topbar :: topbar('Student details')}"></header><div class="surface p-4"><div class="d-flex justify-content-between align-items-start mb-4"><div><h2 class="h4" th:text="${student.fullName}"></h2><span class="status" th:classappend="${student.status}" th:text="${student.status}"></span></div><div class="action-row"><a class="btn btn-outline-secondary" th:href="@{/admin/students}">Back</a><a class="btn btn-primary" th:href="@{/admin/students/edit(id=${student.id})}">Edit</a></div></div><div class="detail-grid"><div class="detail-item"><small>Email</small><strong th:text="${student.email}"></strong></div><div class="detail-item"><small>Mobile</small><strong th:text="${student.mobile}"></strong></div><div class="detail-item"><small>City</small><strong th:text="${student.city}"></strong></div><div class="detail-item"><small>Course note</small><strong th:text="${student.course}"></strong></div><div class="detail-item"><small>Batch</small><strong th:text="${student.batch ?: 'Not assigned'}"></strong></div><div class="detail-item"><small>Admission date</small><strong th:text="${student.admissionDate}"></strong></div><div class="detail-item"><small>Registration type</small><strong th:text="${student.registrationType}"></strong></div><div class="detail-item"><small>Created</small><strong th:text="${student.createdAt}"></strong></div></div></div></main></div></body></html>
