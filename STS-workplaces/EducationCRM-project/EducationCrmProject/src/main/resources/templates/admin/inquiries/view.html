<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Inquiries')}"></head>
<body><div class="app-shell"><aside th:replace="~{fragments/admin-sidebar :: sidebar('inquiries')}"></aside><main class="app-main"><header th:replace="~{fragments/admin-topbar :: topbar('Admission inquiries')}"></header><div th:replace="~{fragments/alerts :: alerts}"></div><div class="surface data-card"><div class="table-responsive"><table class="table"><thead><tr><th>Contact</th><th>Interest</th><th>Message</th><th>Created</th><th>Status</th></tr></thead><tbody><tr th:each="inquiry : ${inquiries}"><td><strong th:text="${inquiry.name}"></strong><div class="small" th:text="${inquiry.email}"></div><div class="small text-muted" th:text="${inquiry.mobile}"></div></td><td th:text="${inquiry.courseInterest ?: 'General'}"></td><td style="min-width:260px" th:text="${inquiry.message}"></td><td th:text="${inquiry.createdAt}"></td><td><form class="d-flex gap-2" th:action="@{/admin/inquiries/status}" method="post"><input type="hidden" name="id" th:value="${inquiry.id}"><select class="form-select form-select-sm" name="status"><option th:each="status : ${statuses}" th:value="${status}" th:text="${status}" th:selected="${status == inquiry.status}"></option></select><button class="btn btn-sm btn-outline-primary">Save</button></form></td></tr><tr th:if="${#lists.isEmpty(inquiries)}"><td colspan="5" class="text-center text-muted py-5">No inquiries yet.</td></tr></tbody></table></div></div></main></div><script th:replace="~{fragments/alerts :: scripts}"></script></body></html>
