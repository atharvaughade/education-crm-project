<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Edit student')}"></head>
<body><div class="app-shell"><aside th:replace="~{fragments/admin-sidebar :: sidebar('students')}"></aside><main class="app-main"><header th:replace="~{fragments/admin-topbar :: topbar('Edit student')}"></header><div class="surface p-4"><form th:action="@{/admin/students/edit}" th:object="${student}" method="post" novalidate><input type="hidden" th:field="*{id}"><div th:if="${#fields.hasGlobalErrors()}" class="alert alert-danger" th:each="error : ${#fields.globalErrors()}" th:text="${error}"></div><div class="row g-3"><div class="col-md-6"><label class="form-label">First name</label><input class="form-control" th:field="*{firstName}"><div class="field-error" th:errors="*{firstName}"></div></div><div class="col-md-6"><label class="form-label">Last name</label><input class="form-control" th:field="*{lastName}"><div class="field-error" th:errors="*{lastName}"></div></div><div class="col-md-6"><label class="form-label">Email</label><input class="form-control" type="email" th:field="*{email}"><div class="field-error" th:errors="*{email}"></div></div><div class="col-md-6"><label class="form-label">Mobile</label><input class="form-control" th:field="*{mobile}"><div class="field-error" th:errors="*{mobile}"></div></div><div class="col-md-6"><label class="form-label">City</label><input class="form-control" th:field="*{city}"></div><div class="col-md-6"><label class="form-label">Status</label><select class="form-select" th:field="*{status}"><option value="ACTIVE">ACTIVE</option><option value="INACTIVE">INACTIVE</option></select></div><div class="col-md-4"><label class="form-label">Course note</label><input class="form-control" th:field="*{course}"></div><div class="col-md-4"><label class="form-label">Batch</label><input class="form-control" th:field="*{batch}"></div><div class="col-md-4"><label class="form-label">Admission date</label><input class="form-control" type="date" th:field="*{admissionDate}"></div><div class="col-12 d-flex gap-2"><button class="btn btn-primary" type="submit">Save changes</button><a class="btn btn-outline-secondary" th:href="@{/admin/students}">Cancel</a></div></div></form></div></main></div></body></html>
