<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Courses')}"></head>
<body><div class="app-shell"><aside th:replace="~{fragments/admin-sidebar :: sidebar('courses')}"></aside><main class="app-main"><header th:replace="~{fragments/admin-topbar :: topbar('Courses')}"></header><div th:replace="~{fragments/alerts :: alerts}"></div><div class="surface data-card"><div class="d-flex justify-content-between align-items-center gap-3 flex-wrap mb-3"><form class="d-flex gap-2 flex-grow-1" th:action="@{/admin/courses/view}" method="get"><input class="form-control" name="keyword" th:value="${keyword}" placeholder="Search title or category"><button class="btn btn-outline-primary">Search</button><a class="btn btn-outline-secondary" th:href="@{/admin/courses/view}">Clear</a></form><a class="btn btn-primary" th:href="@{/admin/courses/add}">Add course</a></div><div class="table-responsive"><table class="table"><thead><tr><th>Title</th><th>Category</th><th>Level</th><th>Price</th><th>Status</th><th>Actions</th></tr></thead><tbody><tr th:each="course : ${courses}"><td th:text="${course.title}"></td><td th:text="${course.category}"></td><td th:text="${course.level}"></td><td th:text="${'₹' + course.price}"></td><td><span class="status" th:classappend="${course.status}" th:text="${course.status}"></span></td><td><div class="action-row"><a class="btn btn-sm btn-outline-primary" th:href="@{/admin/courses/details(id=${course.id})}">View</a><a class="btn btn-sm btn-outline-secondary" th:href="@{/admin/courses/edit(id=${course.id})}">Edit</a><form th:action="@{/admin/courses/delete}" method="post" onsubmit="return confirm('Deactivate this course?')"><input type="hidden" name="id" th:value="${course.id}"><button class="btn btn-sm btn-outline-danger" type="submit">Deactivate</button></form></div></td></tr><tr th:if="${#lists.isEmpty(courses)}"><td colspan="6" class="text-center text-muted py-5">No courses found.</td></tr></tbody></table></div></div></main></div><script th:replace="~{fragments/alerts :: scripts}"></script></body></html>
