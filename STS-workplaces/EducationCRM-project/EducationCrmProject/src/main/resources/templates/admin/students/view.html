<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Students')}"></head>
<body><div class="app-shell"><aside th:replace="~{fragments/admin-sidebar :: sidebar('students')}"></aside><main class="app-main"><header th:replace="~{fragments/admin-topbar :: topbar('Students')}"></header><div th:replace="~{fragments/alerts :: alerts}"></div><div class="surface data-card"><div class="d-flex justify-content-between align-items-center gap-3 flex-wrap mb-3"><form class="d-flex gap-2 flex-grow-1" th:action="@{/admin/students}" method="get"><input class="form-control" name="keyword" th:value="${keyword}" placeholder="Search name, email, mobile or course"><button class="btn btn-outline-primary" type="submit">Search</button><a class="btn btn-outline-secondary" th:href="@{/admin/students}">Clear</a></form><a class="btn btn-primary" th:href="@{/admin/students/add}">Add student</a></div><div class="table-responsive"><table class="table"><thead><tr><th>Name</th><th>Email</th><th>Mobile</th><th>Course</th><th>Status</th><th>Actions</th></tr></thead><tbody><tr th:each="student : ${students}"><td th:text="${student.fullName}"></td><td th:text="${student.email}"></td><td th:text="${student.mobile}"></td><td th:text="${student.course}"></td><td><span class="status" th:classappend="${student.status}" th:text="${student.status}"></span></td><td><div class="action-row"><a class="btn btn-sm btn-outline-primary" th:href="@{/admin/students/details(id=${student.id})}">View</a><a class="btn btn-sm btn-outline-secondary" th:href="@{/admin/students/edit(id=${student.id})}">Edit</a><form th:action="@{/admin/students/delete}" method="post" onsubmit="return confirm('Deactivate this student account?')"><input type="hidden" name="id" th:value="${student.id}"><button class="btn btn-sm btn-outline-danger" type="submit">Deactivate</button></form></div></td></tr><tr th:if="${#lists.isEmpty(students)}"><td colspan="6" class="text-center text-muted py-5">No students found.</td></tr></tbody></table></div></div></main></div><script th:replace="~{fragments/alerts :: scripts}"></script></body></html>
