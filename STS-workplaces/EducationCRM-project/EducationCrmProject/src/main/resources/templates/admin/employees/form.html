<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(${employee.id == null ? 'Add employee' : 'Edit employee'})}"></head>
<body><div class="app-shell"><aside th:replace="~{fragments/admin-sidebar :: sidebar('employees')}"></aside><main class="app-main"><header th:replace="~{fragments/admin-topbar :: topbar(${employee.id == null ? 'Add employee' : 'Edit employee'})}"></header><div class="surface p-4"><form th:action="${employee.id == null} ? @{/admin/employees/add} : @{/admin/employees/edit}" th:object="${employee}" method="post" novalidate><input th:if="${employee.id != null}" type="hidden" th:field="*{id}"><div th:if="${#fields.hasGlobalErrors()}" class="alert alert-danger" th:each="error : ${#fields.globalErrors()}" th:text="${error}"></div><div class="row g-3"><div class="col-md-6"><label class="form-label">First name</label><input class="form-control" th:field="*{firstName}"><div class="field-error" th:errors="*{firstName}"></div></div><div class="col-md-6"><label class="form-label">Last name</label><input class="form-control" th:field="*{lastName}"></div><div class="col-md-6"><label class="form-label">Email</label><input class="form-control" type="email" th:field="*{email}"></div><div class="col-md-6"><label class="form-label">Mobile</label><input class="form-control" th:field="*{mobile}"></div><div class="col-md-6"><label class="form-label">Department</label><input class="form-control" th:field="*{department}"></div><div class="col-md-6"><label class="form-label">Designation</label><input class="form-control" th:field="*{designation}"></div><div class="col-md-4"><label class="form-label">Salary</label><input class="form-control" type="number" min="0" step="0.01" th:field="*{salary}"></div><div class="col-md-4"><label class="form-label">Joining date</label><input class="form-control" type="date" th:field="*{joiningDate}"></div><div class="col-md-4"><label class="form-label">Status</label><select class="form-select" th:field="*{status}"><option value="ACTIVE">ACTIVE</option><option value="INACTIVE">INACTIVE</option></select></div><div class="col-12 d-flex gap-2"><button class="btn btn-primary" type="submit" th:text="${employee.id == null ? 'Add employee' : 'Save changes'}"></button><a class="btn btn-outline-secondary" th:href="@{/admin/employees}">Cancel</a></div></div></form></div></main></div></body></html>
