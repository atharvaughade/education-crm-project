<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Admin dashboard')}"></head>
<body><div class="app-shell"><aside th:replace="~{fragments/admin-sidebar :: sidebar('dashboard')}"></aside><main class="app-main"><header th:replace="~{fragments/admin-topbar :: topbar('Dashboard')}"></header><div th:replace="~{fragments/alerts :: alerts}"></div>
<div class="row g-3 mb-4"><div class="col-sm-6 col-xl-3"><div class="surface metric"><div class="metric-value" th:text="${stats.students}"></div><div class="metric-label">Active students</div></div></div><div class="col-sm-6 col-xl-3"><div class="surface metric"><div class="metric-value" th:text="${stats.activeCourses}"></div><div class="metric-label">Active courses</div></div></div><div class="col-sm-6 col-xl-3"><div class="surface metric"><div class="metric-value" th:text="${stats.enrollments}"></div><div class="metric-label">Enrollments</div></div></div><div class="col-sm-6 col-xl-3"><div class="surface metric"><div class="metric-value" th:text="${'₹' + stats.revenue}"></div><div class="metric-label">Completed revenue</div></div></div></div>
<div class="row g-4"><div class="col-lg-7"><div class="surface data-card"><div class="d-flex justify-content-between mb-3"><h2 class="h5 mb-0">Recent payments</h2><a th:href="@{/admin/sales}">View all</a></div><div class="table-responsive"><table class="table"><thead><tr><th>Reference</th><th>Student</th><th>Course</th><th>Amount</th></tr></thead><tbody><tr th:each="payment : ${recentPayments}"><td th:text="${payment.reference}"></td><td th:text="${payment.student.fullName}"></td><td th:text="${payment.course.title}"></td><td th:text="${'₹' + payment.amount}"></td></tr><tr th:if="${#lists.isEmpty(recentPayments)}"><td colspan="4" class="text-center text-muted py-4">No payments yet.</td></tr></tbody></table></div></div></div><div class="col-lg-5"><div class="surface data-card"><div class="d-flex justify-content-between mb-3"><h2 class="h5 mb-0">New inquiries</h2><a th:href="@{/admin/inquiries}">View all</a></div><div class="border-bottom py-2" th:each="inquiry : ${recentInquiries}"><div class="d-flex justify-content-between"><strong th:text="${inquiry.name}"></strong><span class="status" th:classappend="${inquiry.status}" th:text="${inquiry.status}"></span></div><div class="small text-muted" th:text="${inquiry.courseInterest}"></div></div><div class="empty-state" th:if="${#lists.isEmpty(recentInquiries)}">No inquiries yet.</div></div></div></div>
<div class="row g-3 mt-1"><div class="col-md-4"><div class="surface metric"><div class="metric-value" th:text="${stats.employees}"></div><div class="metric-label">Employees</div></div></div><div class="col-md-4"><div class="surface metric"><div class="metric-value" th:text="${stats.openInquiries}"></div><div class="metric-label">New inquiries</div></div></div><div class="col-md-4"><div class="surface metric"><div class="metric-value" th:text="${stats.openFeedback}"></div><div class="metric-label">Open feedback</div></div></div></div>
</main></div><script th:replace="~{fragments/alerts :: scripts}"></script></body></html>
