<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Settings')}"></head>
<body><div class="app-shell"><aside th:replace="~{fragments/admin-sidebar :: sidebar('settings')}"></aside><main class="app-main"><header th:replace="~{fragments/admin-topbar :: topbar('Application settings')}"></header><div th:replace="~{fragments/alerts :: alerts}"></div><div class="surface p-4" style="max-width:850px"><form th:action="@{/admin/settings}" method="post"><div class="row g-3"><div class="col-12"><label class="form-label">Academy name</label><input class="form-control" name="academy.name" th:value="${settings['academy.name']}" required></div><div class="col-md-6"><label class="form-label">Support email</label><input class="form-control" type="email" name="academy.email" th:value="${settings['academy.email']}" required></div><div class="col-md-6"><label class="form-label">Support phone</label><input class="form-control" name="academy.phone" th:value="${settings['academy.phone']}" required></div><div class="col-12"><label class="form-label">Address</label><input class="form-control" name="academy.address" th:value="${settings['academy.address']}" required></div><div class="col-md-6"><label class="form-label">Allow demo enrollment</label><select class="form-select" name="enrollment.enabled"><option value="true" th:selected="${settings['enrollment.enabled'] == 'true'}">Enabled</option><option value="false" th:selected="${settings['enrollment.enabled'] == 'false'}">Disabled</option></select></div><div class="col-12"><button class="btn btn-primary" type="submit">Save settings</button></div></div></form></div></main></div><script th:replace="~{fragments/alerts :: scripts}"></script></body></html>
