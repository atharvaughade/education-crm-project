<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Sales')}"></head>
<body><div class="app-shell"><aside th:replace="~{fragments/admin-sidebar :: sidebar('sales')}"></aside><main class="app-main"><header th:replace="~{fragments/admin-topbar :: topbar('Sales and payments')}"></header><div class="row g-3 mb-4"><div class="col-md-6"><div class="surface metric"><div class="metric-value" th:text="${'₹' + revenue}"></div><div class="metric-label">Completed revenue</div></div></div><div class="col-md-6"><div class="surface metric"><div class="metric-value" th:text="${paymentCount}"></div><div class="metric-label">Payment records</div></div></div></div><div class="surface data-card"><div class="table-responsive"><table class="table"><thead><tr><th>Reference</th><th>Student</th><th>Course</th><th>Method</th><th>Amount</th><th>Status</th><th>Paid</th></tr></thead><tbody><tr th:each="payment : ${payments}"><td th:text="${payment.reference}"></td><td th:text="${payment.student.fullName}"></td><td th:text="${payment.course.title}"></td><td th:text="${payment.method}"></td><td th:text="${'₹' + payment.amount}"></td><td><span class="status" th:classappend="${payment.status}" th:text="${payment.status}"></span></td><td th:text="${payment.paidAt}"></td></tr><tr th:if="${#lists.isEmpty(payments)}"><td colspan="7" class="text-center text-muted py-5">No payments yet.</td></tr></tbody></table></div></div></main></div></body></html>
