<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Admin profile')}"></head>
<body><div class="app-shell"><aside th:replace="~{fragments/admin-sidebar :: sidebar('profile')}"></aside><main class="app-main"><header th:replace="~{fragments/admin-topbar :: topbar('Profile')}"></header><div th:replace="~{fragments/alerts :: alerts}"></div><div class="row g-4"><div class="col-lg-7"><div class="surface p-4"><h2 class="h5 mb-4">Administrator information</h2><form th:action="@{/admin/profile}" th:object="${adminProfileForm}" method="post"><div class="row g-3"><div class="col-md-6"><label class="form-label">First name</label><input class="form-control" th:field="*{firstName}"><div class="field-error" th:errors="*{firstName}"></div></div><div class="col-md-6"><label class="form-label">Last name</label><input class="form-control" th:field="*{lastName}"><div class="field-error" th:errors="*{lastName}"></div></div><div class="col-12"><label class="form-label">Email</label><input class="form-control" th:value="${admin.email}" readonly></div><div class="col-12"><label class="form-label">Mobile</label><input class="form-control" th:field="*{mobile}"><div class="field-error" th:errors="*{mobile}"></div></div><div class="col-12"><button class="btn btn-primary" type="submit">Save profile</button></div></div></form></div></div><div class="col-lg-5"><div class="surface p-4"><h2 class="h5 mb-3">Change password</h2><form th:action="@{/admin/profile/change-password}" th:object="${passwordChangeForm}" method="post"><div class="mb-3"><label class="form-label">Current password</label><input class="form-control" type="password" th:field="*{currentPassword}"></div><div class="mb-3"><label class="form-label">New password</label><input class="form-control" type="password" th:field="*{newPassword}"></div><div class="mb-3"><label class="form-label">Confirm password</label><input class="form-control" type="password" th:field="*{confirmPassword}"></div><button class="btn btn-outline-primary" type="submit">Change password</button></form></div></div></div></main></div><script th:replace="~{fragments/alerts :: scripts}"></script></body></html>
